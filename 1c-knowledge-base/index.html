<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1С База Знаний — Учебник программиста</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">

    <link rel="stylesheet" href="css/code.css">

<body>

<header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <a href="#home" class="logo" onclick="navigate('home'); return false;">

        <div class="logo-text">
            <span class="brand">1С База Знаний</span>
            <span class="sub">ART · Учебник</span>
        </div>
    </a>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по учебнику..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
    </div>
</header>

<div class="layout">
    <aside id="sidebar"><!-- Генерируется JS из nav-config.js --></aside>
    <main id="content">
        <div class="loading">Загрузка...</div>
    </main>
</div>

<footer>
    <div class="foot-left">
        <strong style="color:var(--accent)">ART</strong> · База знаний 1С — учебник · 2024
    </div>
    <div class="foot-right">
        <span>🐙 GitHub: <a href="https://github.com/OBLADAET-ru" target="_blank" rel="noopener">OBLADAET-ru</a></span>
        <span>👤 Создатель: <strong style="color:var(--text)">Платонов Виктор А.</strong></span>
    </div>
</footer>

<script src="js/nav-config.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/router.js"></script>

</html>
